<line x1="57" y1="24" x2="57" y2="76" stroke="#131313" stroke-width="3" stroke-dasharray="5 6" stroke-linecap="round"/>

<!-- badge: same circle as JPG75, with a play triangle + CUT inside -->
<circle cx="70" cy="70" r="16" fill="#4f8cff" stroke="#131313" stroke-width="4"/>
<polygon points="81,70 64.5,79.5 64.5,60.5" fill="#131313" stroke="#131313" stroke-width="3" stroke-linejoin="round"/>
<text x="69.8" y="72.1" font-family="Arial, sans-serif" font-size="6" font-weight="800" fill="#4f8cff" text-anchor="middle">CUT</text>
