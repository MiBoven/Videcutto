<circle cx="36" cy="44" r="3.5" fill="#4f8cff"/>
<path d="M28 60L38 53L46 58L58 46L72 57V60Z" fill="#4f8cff" stroke="#4f8cff" stroke-width="1.5" stroke-linejoin="round"/>
</g>
<rect x="28" y="28" width="44" height="44" rx="8" fill="none" stroke="#4f8cff" stroke-width="4" stroke-linejoin="round"/>

<!-- two vertical dashed cut lines (black, cutting through frame and film strips) -->
