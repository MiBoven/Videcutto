</clipPath>
</defs>
<rect width="100" height="100" rx="22" fill="#131313"/><rect x="6" y="6" width="88" height="88" rx="18" fill="none" stroke="#4f8cff" stroke-width="2" opacity="0.35"/>

<!-- inward-pointing corner arrows (as in JPG75) -->
<path d="M16 16L26 26M26 26H18M26 26V18" fill="none" stroke="#4f8cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M84 16L74 26M74 26H82M74 26V18" fill="none" stroke="#4f8cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
