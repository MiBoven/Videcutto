<path d="M84 84L74 74M74 74H82M74 74V82" fill="none" stroke="#4f8cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<!-- photo with film strips top and bottom, sun + mountains in between -->
<g clip-path="url(#photoClip)">
<rect x="28" y="28" width="44" height="9" fill="#4f8cff"/>
<rect x="28" y="63" width="44" height="9" fill="#4f8cff"/>
<g fill="#131313">
<rect x="32" y="31" width="4" height="3" rx="0.8"/>
<rect x="40" y="31" width="4" height="3" rx="0.8"/>
<rect x="48" y="31" width="4" height="3" rx="0.8"/>
<rect x="56" y="31" width="4" height="3" rx="0.8"/>
<rect x="64" y="31" width="4" height="3" rx="0.8"/>
<rect x="32" y="66" width="4" height="3" rx="0.8"/>
